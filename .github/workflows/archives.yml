name: Archives BRVM (vérification)

# Documents PDF du site de la BRVM gardés par l'archive web et absents de la liste des publications (scripts/archives_brvm.py).
# Vérification seulement, lancée à la main : ne lit aucun document et ne touche ni aux données ni au site ; la liste trouvée est
# résumée dans les annotations et publiée sur la branche de diagnostic `probe` (archives.json, remplacée à chaque vérification).
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  archives:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Liste des publications connues
        run: |
          mkdir -p /tmp/cpt
          if git fetch -q --depth 1 origin comptes; then git archive FETCH_HEAD index.json brvm_rapports.json | tar -x -C /tmp/cpt; fi
          # miroir de la liste tierce (branche raw) : utilisé si elle ne répond plus ; à défaut, pages de brvm.org seules
          mkdir -p /tmp/raw && (git fetch -q --depth 1 origin raw && git archive FETCH_HEAD brvm_src/events.json | tar -x -C /tmp/raw) || true
          python3 scripts/fetch_extra.py --out /tmp/cpt --only comptes_list
          test -s /tmp/cpt/cpt_evs.json
      - name: Documents gardés par l'archive web
        run: timeout 1800 python3 scripts/archives_brvm.py --evs /tmp/cpt/cpt_evs.json --out /tmp/arch || echo "::warning::Vérification des archives interrompue (durée)"
      - name: Publier la liste (branche de diagnostic probe)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -s /tmp/arch/archives.json ] || exit 0
          mkdir -p /tmp/pub && cp /tmp/arch/archives.json /tmp/pub/
          printf '{"git":{"deploymentEnabled":false}}\n' > /tmp/pub/vercel.json
          cd /tmp/pub && git init -q -b probe && git config user.name fqt-bot && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Archives BRVM $(date -u +%H:%M)" && git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" probe || echo "::warning::Liste non publiée"
