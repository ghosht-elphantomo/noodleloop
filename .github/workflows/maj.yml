name: Mise à jour

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [complet, rapide]
        default: complet

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.event.schedule == '35 22 * * 1-5' && 'maj-soir' || (((github.event_name == 'schedule') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'rapide')) && 'maj-rapide' || 'maj-complet') }}
  cancel-in-progress: false

jobs:
  porte:
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          EV: ${{ github.event_name }}
          SOIR: ${{ github.event.schedule == '35 22 * * 1-5' && '1' || '0' }}
        run: |
          go=1
          if [ "$EV" = schedule ] && [ "$SOIR" != 1 ]; then
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/maj.yml/runs?event=workflow_dispatch&per_page=5" \
                  --jq '[.workflow_runs[] | select((.created_at | fromdateiso8601) > (now - 900))] | length' 2> /dev/null || echo 0)
            [ "${n:-0}" -gt 0 ] && go=0
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  maj:
    needs: porte
    if: needs.porte.outputs.go == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ ((github.event_name == 'schedule' && github.event.schedule != '35 22 * * 1-5') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'rapide')) && 30 || 120 }}
    env:
      K1: ${{ secrets.K1 }}
      K2: ${{ secrets.K2 }}
      D1: ${{ secrets.D1 }}
      ESSAI: "1"
      SOIR: ${{ github.event.schedule == '35 22 * * 1-5' && '1' || '0' }}
      MODE: ${{ (github.event.schedule == '35 22 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'complet')) && 'eod' || 'live' }}
      M: /tmp/c/automatisations/moteur
    steps:
      - name: Préparation
        run: git clone -q --depth 1 "https://x-access-token:${K1}@github.com/${D1}.git" /tmp/c > /dev/null 2>&1 || { echo "::error::préparation"; exit 1; }
      - uses: actions/cache/restore@v6
        with:
          path: /tmp/cc
          key: c1${{ env.ESSAI == '1' && 'e' || '' }}-${{ github.run_id }}
          restore-keys: c1${{ env.ESSAI == '1' && 'e' || '' }}-
      - name: Étape 1
        run: bash "$M/maj.sh" prep
      - name: Étape 2
        run: bash "$M/maj.sh" e1
      - name: Étape 3
        continue-on-error: true
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
        run: bash "$M/maj.sh" e2
      - name: Étape 4
        continue-on-error: true
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
        run: bash "$M/maj.sh" e3
      - name: Calcul
        run: bash "$M/maj.sh" calcul
      - name: Publication
        run: bash "$M/maj.sh" pub
      - name: Fin
        if: always()
        run: bash "$M/maj.sh" fin
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: /tmp/cc
          key: c1${{ env.ESSAI == '1' && 'e' || '' }}-${{ github.run_id }}
