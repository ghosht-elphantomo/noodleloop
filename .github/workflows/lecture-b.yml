name: Lecture B

on:
  workflow_dispatch:
    inputs:
      chain:
        default: "0"

permissions:
  contents: read
  actions: write

concurrency:
  group: lecture-b
  cancel-in-progress: false

env:
  K1: ${{ secrets.K1 }}
  K2: ${{ secrets.K2 }}
  D1: ${{ secrets.D1 }}
  ESSAI: "1"
  M: /tmp/c/automatisations/moteur
  CHAIN: ${{ inputs.chain || '0' }}
  WF: lecture-b.yml

jobs:
  a:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Préparation
        run: git clone -q --depth 1 "https://x-access-token:${K1}@github.com/${D1}.git" /tmp/c > /dev/null 2>&1 || { echo "::error::préparation"; exit 1; }
      - name: Étape 1
        run: bash "$M/dividendes.sh" passage
      - name: Suite
        run: bash "$M/dividendes.sh" suite
