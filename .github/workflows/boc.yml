name: Bulletins officiels BRVM

# Reconstitution de l'historique des 48 actions à partir des seuls bulletins officiels de la cote (BRVM) :
# séances récentes d'abord, puis l'archive jusqu'en 2012, par tranches. Résultat sur la branche `boc` (lue par le terminal).
on:
  schedule:
    - cron: "41 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: boc
  cancel-in-progress: false

jobs:
  boc:
    # machines Ubuntu 24.04 gardées : lecture des PDF identique à celle de tout le cache (voir essai.yml et docs/GUIDE.md)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Outils PDF
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Restaurer la branche boc
        run: |
          mkdir -p /tmp/boc
          # 3 essais ; une branche qui existe mais reste illisible arrête le passage (sinon tout serait relu et republié de force
          # par-dessus la version en ligne, incomplet)
          ok=0
          for i in 1 2 3; do
            if git fetch -q --depth 1 origin boc; then git ls-tree -r --name-only FETCH_HEAD | wc -l > /tmp/boc_n0; git archive FETCH_HEAD | tar -x -C /tmp/boc; ok=1; break; fi
            rc=0; git ls-remote --exit-code --heads origin boc > /dev/null 2>&1 || rc=$?
            if [ "$rc" = 2 ]; then ok=1; break; fi
            sleep $((i * 10))
          done
          [ "$ok" = 1 ] || { echo "::error title=Restauration::branche boc présente mais illisible après 3 essais : passage arrêté"; exit 1; }
      - name: Lire les bulletins (récents puis archive)
        continue-on-error: true
        env:
          BOC_BUDGET: "2700"
        run: timeout 3200 python3 scripts/fetch_extra.py --out /tmp/boc --only bochist
      - name: Publier (branche boc)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '{"git":{"deploymentEnabled":false}}\n' > /tmp/boc/vercel.json
          URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          export GIT_DIR=/tmp/boc.git GIT_WORK_TREE=/tmp/boc
          rm -rf "$GIT_DIR"; git init -q -b boc
          git config user.name "fqt-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Bulletins $(date -u +'%d/%m/%Y %H:%M') UTC" || exit 0
          # republication forcée (commit unique) : refusée si la branche perd plus de 10 % de ses fichiers (restauration incomplète)
          N0=$(cat /tmp/boc_n0 2>/dev/null || echo 0); N1=$(git ls-files | wc -l)
          if [ "$N0" -gt 0 ] && [ $((N1 * 10)) -lt $((N0 * 9)) ]; then echo "::error title=Branche boc::$N1 fichiers au lieu de $N0 : publication refusée, version en ligne gardée"; exit 1; fi
          git push -q -f "$URL" HEAD:boc
