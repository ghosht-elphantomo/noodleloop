name: Terminal

# Terminal FQT, actualisé toutes les 15 minutes, jour et nuit :
#   - séance BRVM (brvm.org), cours US (Nasdaq) et crypto (Coinbase), QQQ 5 min, actualités (flux RSS),
#     nouvelles publications des sociétés cotées (brvm.org) et nouveaux dépôts SEC (comptes rafraîchis aussitôt) ;
#   - tous les calculs refaits avec ces cours (ratios, Fear & Greed, cartes, corrélations, alertes...).
# Chaque soir (22:35 UTC) : base complète (BRVM depuis 2006, Nasdaq, FRED, CBOE, CNN, SEC, Banque mondiale, bulletins BRVM).
# Les données (data/) sont écrites toutes les 15 min sur la branche `data` ; le site Vercel les lit en direct par un relais
# (api/data.js), sans redéploiement. Vercel déploie `main` (public/ + api/) et la branche `site` (même contenu, réécrite
# seulement si le code change) ; les branches data, raw et probe ne déclenchent aucun déploiement (vercel.json) :
# quelques déploiements par jour au plus (limite du plan gratuit : 100).
# Les données brutes (historiques Nasdaq, comptes SEC, bulletins...) vivent sur la branche `raw`.
on:
  schedule:
    - cron: "*/15 * * * *"         # toutes les 15 minutes
    - cron: "35 22 * * 1-5"        # EOD : base complète
  workflow_dispatch:
    inputs:
      mode:
        description: "live (relevé de 15 min) ou eod (base complète)"
        type: choice
        options: [eod, live]
        default: eod
  push:
    branches: [main]
    paths: ["web/**", "scripts/**", "build.py", "index.html", "deploy/**", "api/**", "vercel.json", ".github/workflows/terminal.yml"]

permissions:
  contents: write
  actions: read

# relevés de 15 min (programmés ou lancés par le métronome) et base complète dans deux files séparées :
# un relevé en attente ne peut pas annuler la base du soir
concurrency:
  group: ${{ ((github.event_name == 'schedule' && github.event.schedule != '35 22 * * 1-5') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'live')) && 'terminal-live' || 'terminal-full' }}
  cancel-in-progress: false

jobs:
  # Le métronome (metronome.yml) lance un relevé pile à chaque quart d'heure ; la programmation */15 reste en secours
  # et s'efface si le métronome a lancé un relevé il y a moins de 12 minutes (pas de doublon).
  gate:
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go=1
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "35 22 * * 1-5" ]; then
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/terminal.yml/runs?event=workflow_dispatch&per_page=5" \
                  --jq '[.workflow_runs[] | select((.created_at | fromdateiso8601) > (now - 720))] | length' || echo 0)
            if [ "${n:-0}" -gt 0 ]; then go=0; echo "Le métronome vient de lancer un relevé : relevé de secours inutile."; fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  refresh:
    needs: gate
    if: needs.gate.outputs.go == '1'
    # machines Ubuntu 24.04 gardées : lecture des PDF identique à celle de tout le cache (voir essai.yml et docs/GUIDE.md)
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v7

      - name: Mode
        id: mode
        run: |
          MODE=live
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then MODE="${{ inputs.mode }}"; fi
          if [ "${{ github.event.schedule }}" = "35 22 * * 1-5" ]; then MODE=eod; fi
          if [ "${{ github.event_name }}" = "push" ]; then
            # pages seulement : relevé normal ; scripts de collecte modifiés : base complète
            git fetch -q --depth 1 origin "${{ github.event.before }}" 2>/dev/null || true
            if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null | grep -qE '^(scripts/|\.github/)'; then MODE=eod; fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Mode : $MODE"

      - name: Restaurer les données et les données brutes
        run: |
          mkdir -p /tmp/site /tmp/state /tmp/raw
          cp seed/brvm.json /tmp/state/brvm.json
          # données publiées (branche data ; à défaut l'ancienne branche site qui les contenait)
          if git fetch -q --depth 1 origin data; then SRC=data; elif git fetch -q --depth 1 origin site; then SRC=site; else SRC=; fi
          if [ -n "$SRC" ]; then
            git rev-parse FETCH_HEAD > /tmp/data_sha; echo "$SRC" > /tmp/data_src
            git archive FETCH_HEAD data | tar -x -C /tmp/site || true
            if [ -f /tmp/site/data/session.json ]; then cp /tmp/site/data/session.json /tmp/state/brvm.json; fi
          fi
          mkdir -p /tmp/site/data
          if git fetch -q --depth 1 origin raw; then git rev-parse FETCH_HEAD > /tmp/raw_sha; git archive FETCH_HEAD | tar -x -C /tmp/raw || true; fi
          rm -f /tmp/raw/.dirty
          # bulletins officiels de la cote déjà lus (branche boc, écrite par le workflow « Bulletins officiels BRVM »)
          mkdir -p /tmp/boc && if git fetch -q --depth 1 origin boc; then git archive FETCH_HEAD | tar -x -C /tmp/boc || true; fi

      - name: Cache des sources (miroirs CSV)
        uses: actions/cache@v6
        with:
          path: /tmp/bcache
          key: bcache-${{ github.run_id }}
          restore-keys: bcache-

      - name: Relever les cours (BRVM, QQQ, US, crypto)
        run: python3 scripts/scrape.py --mode "${{ steps.mode.outputs.mode }}" --state /tmp/state --out /tmp/site

      - name: Actualités, publications BRVM, dépôts SEC, obligations BRVM, capitalisations mondiales
        continue-on-error: true
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
          FQT_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          # Fear & Greed de CNN relevé à chaque passage en semaine (le soir, il est déjà relevé avec les sources complémentaires)
          # calendrier du FOMC relu au plus une fois par jour (anticipations de la Fed)
          ONLY=avis,watch,obl,cmc,cal,fomc; if [ "$(date -u +%u)" -le 5 ] && [ "$FQT_MODE" != "eod" ]; then ONLY=$ONLY,cnn; fi
          timeout 360 python3 scripts/fetch_extra.py --out /tmp/raw --only $ONLY --site /tmp/site/data --news /tmp/site/data/news.json

      - name: Outils PDF (EOD)
        if: steps.mode.outputs.mode == 'eod'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null || true

      - name: Sources complémentaires (FRED, CBOE, CNN, crypto, Banque mondiale, bulletins BRVM)
        if: steps.mode.outputs.mode == 'eod'
        continue-on-error: true
        run: timeout 1100 python3 scripts/fetch_extra.py --out /tmp/raw --only fred,cboe,cnn,crypto,wb,probe,boc,prof,bceao,umoa,eia,fut,ei,ussplit,usdiv,avisocr,flottant --site /tmp/site/data

      - name: Notations financières et flottant officiel (EOD, PDF de brvm.org)
        if: steps.mode.outputs.mode == 'eod'
        continue-on-error: true
        run: timeout 900 python3 scripts/fetch_extra.py --out /tmp/raw --only ratings,sgi --site /tmp/site/data

      - name: Comptes BRVM sur 10 exercices (archives)
        if: steps.mode.outputs.mode == 'eod'
        continue-on-error: true
        run: timeout 1600 python3 scripts/fetch_extra.py --out /tmp/raw --only sikah

      - name: Comptes SEC et consensus des analystes (EOD)
        if: steps.mode.outputs.mode == 'eod'
        continue-on-error: true
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
        run: timeout 1200 python3 scripts/fetch_extra.py --out /tmp/raw --only sec,analyst

      - name: Fiches et détenteurs des sociétés US (EOD)
        if: steps.mode.outputs.mode == 'eod'
        continue-on-error: true
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
        run: timeout 600 python3 scripts/fetch_extra.py --out /tmp/raw --only profus

      - name: Historiques Nasdaq (EOD, incrémental)
        if: steps.mode.outputs.mode == 'eod'
        continue-on-error: true
        run: timeout 900 python3 scripts/fetch_extra.py --out /tmp/raw --only nasdaq

      - name: Recalculer toute la base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # états financiers publiés à la BRVM, lus et vérifiés (branche comptes) ; copie gardée sur la branche raw en secours
          if curl -sfL -m 40 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" \
               "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/comptes.json?ref=comptes" -o /tmp/comptes.json \
             && python3 -c "import json,sys;d=json.load(open('/tmp/comptes.json'));sys.exit(0 if d.get('docs') else 1)"; then
            cp /tmp/comptes.json /tmp/raw/comptes.json
          elif [ -f /tmp/raw/comptes.json ]; then cp /tmp/raw/comptes.json /tmp/comptes.json; fi
          # dividendes lus dans les avis et calendriers de la BRVM (branche dividendes) ; copie gardée sur la branche raw en secours
          if curl -sfL -m 40 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" \
               "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/dividendes.json?ref=dividendes" -o /tmp/dividendes.json \
             && python3 -c "import json,sys;d=json.load(open('/tmp/dividendes.json'));sys.exit(0 if d.get('rows') else 1)"; then
            cp /tmp/dividendes.json /tmp/raw/dividendes_off.json
          elif [ -f /tmp/raw/dividendes_off.json ]; then cp /tmp/raw/dividendes_off.json /tmp/dividendes.json; else rm -f /tmp/dividendes.json; fi
          # listes des documents lus (branches comptes et dividendes) : index de la recherche MOTS CLES ; copie gardée sur la branche raw en secours
          mkdir -p /tmp/srch /tmp/raw/srch
          for f in "comptes:index.json:comptes_index.json" "comptes:brvm_rapports.json:brvm_rapports.json" "dividendes:catalog.json:div_catalog.json"; do
            IFS=: read -r br src dst <<< "$f"
            if curl -sfL -m 60 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" \
                 "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/$src?ref=$br" -o "/tmp/srch/$dst" \
               && python3 -c "import json,sys;json.load(open('/tmp/srch/$dst'))"; then
              cp "/tmp/srch/$dst" "/tmp/raw/srch/$dst"
            elif [ -f "/tmp/raw/srch/$dst" ]; then cp "/tmp/raw/srch/$dst" "/tmp/srch/$dst"; else rm -f "/tmp/srch/$dst"; fi
          done
          # base historique BRVM (dépôt public tiers) ; miroir gardé chaque soir sur la branche raw et utilisé si le dépôt devient injoignable
          if timeout 180 git clone -q --depth 1 https://github.com/harzat/brvm-data-public.git /tmp/brvmsrc && [ -f /tmp/brvmsrc/actions.json ]; then
            # une donnée déjà prise n'est jamais perdue : ce que la base n'a plus (titre, exercice, séance, avis) est repris du miroir
            if [ -f /tmp/raw/brvm_src/actions.json ]; then
              timeout 300 python3 scripts/sticky.py base /tmp/raw/brvm_src /tmp/brvmsrc || echo "::warning::Fusion avec le miroir impossible : base du jour utilisée telle quelle"
            fi
            if [ "${{ steps.mode.outputs.mode }}" = "eod" ]; then rm -rf /tmp/raw/brvm_src && mkdir -p /tmp/raw/brvm_src && tar -C /tmp/brvmsrc --exclude=.git -cf - . | tar -x -C /tmp/raw/brvm_src; fi
          elif [ -f /tmp/raw/brvm_src/actions.json ]; then
            echo "::warning::Base BRVM externe injoignable : miroir de la branche raw utilisé (séances récentes complétées par les bulletins officiels et brvm.org)"
            rm -rf /tmp/brvmsrc && cp -r /tmp/raw/brvm_src /tmp/brvmsrc
          else
            echo "::error::Base BRVM externe injoignable et aucun miroir disponible"; exit 1
          fi
          LIVE=""; if [ "${{ steps.mode.outputs.mode }}" != "eod" ] && [ -f /tmp/site/data/summary.json ]; then LIVE="--live"; fi
          python3 scripts/build_terminal.py --brvm-src /tmp/brvmsrc --out /tmp/site/data --session /tmp/state/brvm.json \
            --extra /tmp/raw --fcf seed/fcf_brvm.json --quotes /tmp/site/data/quotes.json --cache /tmp/bcache --boc /tmp/boc/boc_px $LIVE \
            $([ -f /tmp/comptes.json ] && echo --comptes /tmp/comptes.json) $([ -f /tmp/dividendes.json ] && echo --dividendes /tmp/dividendes.json) \
            --search-src /tmp/srch

      - name: "Publier les données brutes (branche raw, soir ou comptes SEC rafraîchis)"
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          if [ "$MODE" != "eod" ] && [ ! -f /tmp/raw/.dirty ]; then echo "Rien à publier"; exit 0; fi
          rm -f /tmp/raw/.dirty /tmp/raw/report_news-watch.json
          printf '{"git":{"deploymentEnabled":false}}\n' > /tmp/raw/vercel.json
          URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          export GIT_DIR=/tmp/raw.git GIT_WORK_TREE=/tmp/raw
          rm -rf "$GIT_DIR" /tmp/raw/.git
          git init -q -b raw
          git config user.name "fqt-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$MODE" != "eod" ]; then
            # relevé : au-dessus de la version restaurée ; si une base complète a été publiée entre-temps, on n'y touche pas
            git fetch -q --depth 1 "$URL" raw || exit 0
            if [ "$(git rev-parse FETCH_HEAD)" != "$(cat /tmp/raw_sha 2>/dev/null)" ]; then echo "Branche raw republiée entre-temps : publication reportée"; exit 0; fi
            git reset -q FETCH_HEAD
            git add -A && git commit -qm "Brut (relevé) $(date -u +'%d/%m/%Y %H:%M') UTC" || exit 0
            git push -q "$URL" HEAD:raw || echo "Branche raw modifiée entre-temps : publication reportée"
          else
            git add -A && git commit -qm "Brut $(date -u +'%d/%m/%Y %H:%M') UTC" || exit 0
            git push -q -f "$URL" HEAD:raw
          fi

      - name: Publier les données (branche data, lue en direct par le site toutes les 15 min)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          mkdir -p /tmp/dpub && rm -rf /tmp/dpub/* && cp -r /tmp/site/data /tmp/dpub/data
          # garde des données : un fichier disparu, vide, illisible ou anormalement court reprend sa dernière bonne version
          # (publication lue au début de ce passage) ; avertissement dans le passage, jamais un échec
          timeout 120 python3 scripts/garde.py /tmp/dpub/data "$(cat /tmp/data_sha 2>/dev/null)" || true
          printf '{"git":{"deploymentEnabled":false}}\n' > /tmp/dpub/vercel.json
          URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          export GIT_DIR=/tmp/dpub.git GIT_WORK_TREE=/tmp/dpub
          rm -rf "$GIT_DIR"; git init -q -b data
          git config user.name "fqt-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ONTOP=0
          if [ "$MODE" != "eod" ] && [ "$(cat /tmp/data_src 2>/dev/null)" = "data" ] && git fetch -q --depth 1 "$URL" data; then
            # une base complète publiée pendant ce relevé l'emporte : le relevé suivant repartira d'elle
            if [ "$(git rev-parse FETCH_HEAD)" != "$(cat /tmp/data_sha 2>/dev/null)" ]; then echo "Branche data republiée entre-temps : relevé ignoré"; exit 0; fi
            git reset -q FETCH_HEAD && ONTOP=1
          fi
          if [ "$ONTOP" != 1 ] && git fetch -q --depth 1 "$URL" data 2>/dev/null; then
            # base complète (longue) : les fichiers du relevé de 15 min publiés pendant son calcul sont plus récents, on les garde
            mkdir -p /tmp/dnew && rm -rf /tmp/dnew/* && git archive FETCH_HEAD data | tar -x -C /tmp/dnew || true
            python3 - <<'PY'
          import json, os, shutil
          for f in ("live.json", "quotes.json", "world_mkt.json", "session.json", "oil.json", "news.json", "calendar.json", "bonds.json", "world.json"):
              a, b = os.path.join("/tmp/dnew/data", f), os.path.join("/tmp/dpub/data", f)
              try:
                  ta, tb = (json.load(open(a)).get("ts") or 0), (json.load(open(b)).get("ts") or 0) if os.path.exists(b) else 0
              except Exception:
                  continue
              if ta > tb:
                  shutil.copyfile(a, b); print("plus récent sur la branche data, conservé :", f)
          PY
          fi
          git add -A
          git commit -qm "Données $(date -u +'%d/%m/%Y %H:%M') UTC" || { echo "Rien de nouveau"; exit 0; }
          if [ "$ONTOP" = 1 ]; then git push -q "$URL" HEAD:data || echo "Branche data modifiée entre-temps : ce relevé est ignoré"
          else git push -q -f "$URL" HEAD:data; fi

      - name: Publier le site (branche site déployée par Vercel, seulement si le code change)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/web && mkdir -p /tmp/web/public /tmp/web/api
          cp vercel.json /tmp/web/vercel.json
          cp api/data.js /tmp/web/api/data.js
          cp index.html /tmp/web/public/index.html
          cp public/version.json /tmp/web/public/version.json 2>/dev/null || true
          cp deploy/robots.txt /tmp/web/public/robots.txt
          cp web/fonts/LICENSE-NotoSans.txt /tmp/web/public/LICENSE-fonts.txt
          cp web/icons/favicon.ico web/icons/favicon.svg web/icons/apple-touch-icon.png /tmp/web/public/
          URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          SRC_T=$(git log -1 --format=%ct)  # date du code de ce passage : un passage plus ancien ne remplace jamais un site plus récent
          export GIT_DIR=/tmp/web.git GIT_WORK_TREE=/tmp/web
          rm -rf "$GIT_DIR"; git init -q -b site
          git config user.name "fqt-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Site $(date -u +'%d/%m/%Y %H:%M') UTC src_t=$SRC_T"
          NEW=$(git rev-parse HEAD^{tree})
          OLD=$(git fetch -q --depth 1 "$URL" site 2>/dev/null && git rev-parse FETCH_HEAD^{tree} || echo none)
          if [ "$NEW" = "$OLD" ]; then echo "Code inchangé : pas de redéploiement Vercel"; exit 0; fi
          OLD_T=$(git log -1 --format=%B FETCH_HEAD 2>/dev/null | grep -o 'src_t=[0-9]*' | cut -d= -f2); OLD_T=${OLD_T:-0}
          if [ "$SRC_T" -lt "$OLD_T" ]; then echo "Le site en ligne vient d'un code plus récent : pas de retour en arrière"; exit 0; fi
          git push -q -f "$URL" HEAD:site && echo "Site publié : Vercel redéploie"

      - name: Archiver la séance BRVM sur main (EOD)
        if: steps.mode.outputs.mode == 'eod'
        run: |
          git config user.name "fqt-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # une autre exécution (relevé de 15 min ou push) peut avoir archivé entre-temps : on repart de main et on fusionne, sans rebase
          mkdir -p /tmp/arch && cp seed/brvm.json seed/brvm_daily.csv /tmp/arch/
          for i in 1 2 3 4; do
            git fetch -q origin main
            git reset -q --hard FETCH_HEAD
            python3 scripts/archive_merge.py /tmp/arch
            git add seed/brvm.json seed/brvm_daily.csv
            if git diff --cached --quiet; then echo "Rien à archiver"; break; fi
            git commit -qm "mise à jour $(date -u +%F)"
            if git push -q origin HEAD:main; then echo "Archivé"; break; fi
            echo "main a bougé, nouvel essai ($i)"; sleep $((i * 5))
          done
