name: Publication

on:
  workflow_dispatch:
    inputs:
      tache:
        type: choice
        options: ["1", "2", "3"]
        default: "1"
      essai:
        type: choice
        options: ["0", "1"]
        default: "0"

permissions:
  contents: read

concurrency:
  group: publication
  cancel-in-progress: false

env:
  K1: ${{ secrets.K1 }}
  K2: ${{ secrets.K2 }}
  K4: ${{ secrets.K4 }}
  D1: ${{ secrets.D1 }}
  ESSAI: ${{ github.event_name == 'workflow_dispatch' && inputs.essai || '0' }}
  TACHE: ${{ inputs.tache || '1' }}
  M: /tmp/c/automatisations/moteur

jobs:
  a:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Préparation
        run: |
          [ -n "$K1" ] || { echo "::error::préparation (1)"; exit 1; }
          [ -n "$D1" ] || { echo "::error::préparation (2)"; exit 1; }
          [[ "$D1" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ ]] || { echo "::error::préparation (2b)"; exit 1; }
          if [ -n "${K2:-}" ]; then c2=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $K2" "https://api.github.com/repos/$D1"); [ "$c2" = 200 ] || echo "::warning::préparation (4-$c2)"; fi
          git clone -q --depth 1 "https://x-access-token:${K1}@github.com/${D1}.git" /tmp/c > /dev/null 2>&1 || { echo "::error::préparation (3-$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $K1" "https://api.github.com/repos/$D1"))"; exit 1; }
      - name: Étape 1
        run: bash "$M/etape.sh" P 1
      - name: Étape 2
        if: env.TACHE != '3'
        run: bash "$M/etape.sh" P 2
      - name: Étape 3
        if: env.TACHE != '3'
        run: bash "$M/etape.sh" P 3
      - name: Étape 4
        if: env.TACHE != '3'
        run: bash "$M/etape.sh" P 4
      - name: Étape 5
        if: env.TACHE == '3'
        run: bash "$M/etape.sh" P 5
