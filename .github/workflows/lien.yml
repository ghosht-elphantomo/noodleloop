name: Lien temporaire

# Ouvre un lien d'accès au terminal qui expire tout seul (15 min par défaut).
# Le lien pointe vers une copie du site servie depuis ce job par un tunnel Cloudflare à adresse aléatoire
# (https://xxxx.trycloudflare.com) : aucune trace de l'adresse Vercel ni du dépôt dans le lien ou dans la page.
# Les données sont celles du dernier relevé, remises à jour toutes les 4 minutes pendant la durée du lien.
# À l'échéance, le job s'arrête : le tunnel disparaît et le lien ne mène plus nulle part.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Durée de validité du lien, en minutes (1 à 60)"
        default: "15"

permissions:
  contents: read
  deployments: write

jobs:
  lien:
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - name: Ouvrir le lien
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
          MINUTES: ${{ inputs.minutes }}
        run: |
          MIN="$MINUTES"; case "$MIN" in ''|*[!0-9]*) MIN=15;; esac; [ "$MIN" -lt 1 ] && MIN=1; [ "$MIN" -gt 60 ] && MIN=60
          T0=$(date +%s); echo "t0=$T0" >> "$GITHUB_OUTPUT"; echo "min=$MIN" >> "$GITHUB_OUTPUT"
          # copie du site (page seule, sans le relais de données ni la configuration d'hébergement) + données du moment
          mkdir -p /tmp/www && cp public/index.html public/favicon.* public/apple-touch-icon.png /tmp/www/
          # mode anonyme : aucun nom de fournisseur de données à l'écran ni dans les fichiers servis
          sed -i 's#<head>#<head><script>window.FQT_ANON=1</script>#' /tmp/www/index.html
          printf 'User-agent: *\nDisallow: /\n' > /tmp/www/robots.txt
          git fetch -q --depth 1 origin data && git archive FETCH_HEAD data | tar -x -C /tmp/www && python3 scripts/anon_data.py /tmp/www/data
          cat > /tmp/srv.py <<'PY'
          import http.server, functools
          class H(http.server.SimpleHTTPRequestHandler):
              server_version = "web"; sys_version = ""
              def log_message(self, *a): pass
          http.server.ThreadingHTTPServer(("127.0.0.1", 8080), functools.partial(H, directory="/tmp/www")).serve_forever()
          PY
          nohup python3 /tmp/srv.py > /tmp/http.log 2>&1 &
          # données rafraîchies toutes les 4 minutes pendant la durée du lien
          nohup bash -c 'while sleep 240; do rm -rf /tmp/wnext && mkdir -p /tmp/wnext && git fetch -q --depth 1 origin data && git archive FETCH_HEAD data | tar -x -C /tmp/wnext && python3 scripts/anon_data.py /tmp/wnext/data && cp -r /tmp/wnext/data/. /tmp/www/data/; done' > /dev/null 2>&1 &
          # outil de tunnel : dernière version publiée, téléchargée par son numéro et contrôlée par l'empreinte que GitHub publie
          # pour ce fichier (fichier refusé si elle ne correspond pas)
          REL=$(gh api repos/cloudflare/cloudflared/releases/latest 2>/dev/null || true)
          TAG=$(printf '%s' "$REL" | jq -r '.tag_name // empty' 2>/dev/null || true)
          DIG=$(printf '%s' "$REL" | jq -r '.assets[]? | select(.name=="cloudflared-linux-amd64") | .digest // empty' 2>/dev/null | sed 's/^sha256://' || true)
          if [ -n "$TAG" ]; then CFU="https://github.com/cloudflare/cloudflared/releases/download/$TAG/cloudflared-linux-amd64"; else CFU="https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"; fi
          curl -sSL -o /tmp/cf "$CFU" && chmod +x /tmp/cf
          if [ -n "$DIG" ]; then echo "$DIG  /tmp/cf" | sha256sum -c --quiet || { echo "::error::Empreinte de l'outil de tunnel différente de celle publiée : lien non ouvert"; exit 1; }; else echo "::warning::Empreinte de l'outil de tunnel indisponible (version ${TAG:-inconnue}), fichier non contrôlé"; fi
          echo "Outil de tunnel : version ${TAG:-dernière}"
          nohup /tmp/cf tunnel --no-autoupdate --url http://127.0.0.1:8080 > /tmp/cf.log 2>&1 &
          URL=""; for i in $(seq 1 60); do URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1); [ -n "$URL" ] && break; sleep 2; done
          [ -z "$URL" ] && { tail -30 /tmp/cf.log; echo "::error::Tunnel indisponible"; exit 1; }
          # attend que le lien réponde vraiment (le nom du tunnel met quelques secondes à exister dans le DNS)
          OK=0; for i in $(seq 1 45); do c=$(curl -s -o /dev/null -w '%{http_code}' -m 10 "$URL/" || true); [ "$c" = "200" ] && { OK=1; break; }; sleep 2; done
          FIN=$(date -u -d "@$((T0 + MIN * 60))" +%H:%M)
          # le lien s'affiche tout de suite dans GitHub (section « Deployments » du dépôt, bouton « View deployment »)
          D="Lien valable ${MIN} min, jusqu'à ${FIN} UTC"
          DEP=$(jq -n --arg d "$D" '{ref:"main",environment:"lien-temporaire",auto_merge:false,required_contexts:[],description:$d,transient_environment:true}' | gh api -X POST "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id)
          jq -n --arg u "$URL" --arg d "$D" '{state:"success",environment_url:$u,description:$d}' | gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/$DEP/statuses" --input - >/dev/null
          echo "dep=$DEP" >> "$GITHUB_OUTPUT"
          echo "::notice title=Lien temporaire valable ${MIN} min (jusqu'à ${FIN} UTC)::${URL}"
          { echo "## Lien temporaire"; echo; echo "**${URL}**"; echo; echo "Valable ${MIN} minutes, jusqu'à ${FIN} UTC. Ensuite le lien ne mène plus nulle part."; [ "$OK" = 1 ] || echo "(le lien met parfois une minute à répondre)"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Garder le lien ouvert jusqu'à l'échéance, puis le fermer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          END=$(( ${{ steps.open.outputs.t0 }} + ${{ steps.open.outputs.min }} * 60 )); NOW=$(date +%s)
          [ "$END" -gt "$NOW" ] && sleep $(( END - NOW ))
          pkill -f "cf tunnel" || true; pkill -f "/tmp/srv.py" || true
          DEP="${{ steps.open.outputs.dep }}"; [ -n "$DEP" ] && { jq -n '{state:"inactive",description:"Lien expiré"}' | gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/$DEP/statuses" --input - >/dev/null || true; }
          echo "Lien expiré à $(date -u +%H:%M:%S) UTC."
