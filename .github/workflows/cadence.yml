name: Cadence

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      parent:
        default: ""

permissions:
  actions: write
  contents: read

jobs:
  a:
    runs-on: ubuntu-26.04
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      P: ${{ inputs.parent }}
      CIBLE: maj.yml
    steps:
      - name: Rattrapage
        # tâches qui ne dépendent que de la programmation de GitHub (parfois en retard, rarement oubliée) : si le dernier créneau
        # est passé depuis plus d'une heure sans aucun passage, la tâche est lancée à la main ; une relance au plus par créneau
        # (un passage déjà relancé, même en échec, compte) ; jamais pendant qu'un passage du même créneau tourne
        run: |
          now=$(date -u +%s); debut=$(date -u -d 2026-10-24T06:00:00Z +%s)  # (créneaux antérieurs à la mise en place : ignorés)
          while IFS='|' read -r nom f hm jours entrees; do
            [ -n "$f" ] || continue
            for d in 0 1; do slot=$(date -u -d "$(date -u -d "-$d day" +%F) $hm" +%s); [ "$slot" -le "$now" ] && break; done
            dow=$(date -u -d "@$slot" +%u); case "$jours" in *$dow*) ;; *) continue;; esac
            [ "$slot" -ge "$debut" ] && [ $((now - slot)) -ge 3600 ] || continue
            depuis=$(date -u -d "@$((slot - 600))" +%Y-%m-%dT%H:%M:%SZ)
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$f/runs?per_page=50&created=>=$depuis" \
                  --jq "[.workflow_runs[] | select(.display_title | startswith(\"$nom\"))] | length" 2> /dev/null) || { echo "$nom : liste des passages injoignable"; continue; }
            [ "${n:-0}" -gt 0 ] && continue
            # shellcheck disable=SC2086
            if gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/$f/dispatches" -f ref=main $entrees > /dev/null 2>&1; then
              echo "::warning::$nom : créneau de $(date -u -d "@$slot" +%d/%m\ %H:%M) UTC sans passage, relancée"
            else echo "::error::$nom : créneau manqué et relance impossible"; fi
          done <<'EOF'
          Base du soir|maj.yml|22:35|12345|-f inputs[soir]=1 -f inputs[mode]=complet
          Archive|archive.yml|23:55|1234567|
          Sortie|sortie.yml|00:47|1234567|
          Secours|secours.yml|03:38|1234567|
          Lecture A|lecture-a.yml|04:17|1234567|
          Lecture B|lecture-b.yml|05:29|1234567|
          Vérification|verification.yml|06:10|1234567|
          EOF
      - name: Étape 1
        id: chk
        run: |
          case "$P" in ''|*[!0-9]*) P=0;; esac
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/cadence.yml/runs?status=in_progress&per_page=20" \
                --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and .id != $P and ((.run_started_at // .created_at) | fromdateiso8601) > (now - 21600))] | length" 2> /dev/null || echo 0)
          if [ "${n:-0}" -gt 0 ]; then echo "run=0" >> "$GITHUB_OUTPUT"; else echo "run=1" >> "$GITHUB_OUTPUT"; fi
      - name: Étape 2
        if: steps.chk.outputs.run == '1'
        run: |
          end=$(( $(date +%s) + 340 * 60 ))
          while :; do
            now=$(date +%s); next=$(( (now / 900 + 1) * 900 + 15 ))
            [ "$next" -ge "$end" ] && break
            sleep $(( next - now ))
            for k in 1 2 3; do
              if gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/$CIBLE/dispatches" -f ref=main -f "inputs[mode]=rapide" > /dev/null 2>&1; then
                echo "$(date -u +%H:%M:%S)"; break
              fi
              sleep 20
            done
          done
      - name: Étape 3
        if: steps.chk.outputs.run == '1'
        run: |
          for k in 1 2 3; do
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/cadence.yml/dispatches" -f ref=main -f "inputs[parent]=$GITHUB_RUN_ID" > /dev/null 2>&1 && exit 0
            sleep 20
          done
          echo "::error::relais"; exit 1
